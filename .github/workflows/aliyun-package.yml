name: Package SimMusic for Aliyun
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run test:storage && node scripts/test-import.mjs
      - run: npm run build:aliyun
      - run: node server/smoke.mjs
      - run: node lib/server/catalog-check.mjs
      - run: tar -czf simmusic-aliyun.tar.gz -C dist/standalone .
      - uses: actions/upload-artifact@v4
        with:
          name: simmusic-aliyun-linux
          path: simmusic-aliyun.tar.gz
          retention-days: 14
