# Add as a separate site; do not replace the existing nginx.conf.
# Port 8080 is for initial IP testing. Use a domain + HTTPS for production.
server {
    listen 8080;
    server_name 121.40.158.251;
    client_max_body_size 200k;
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Overwrite untrusted client headers used by the shared rate limiter.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
