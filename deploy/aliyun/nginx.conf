user simmusic simmusic;
worker_processes 1;
pid /opt/simmusic/nginx.pid;
error_log /opt/simmusic/nginx-error.log warn;
events { worker_connections 512; }
http {
 lua_package_path '/www/server/nginx/lib/lua/?.lua;;';
 include /www/server/nginx/conf/mime.types;
 default_type application/octet-stream;
 client_body_temp_path /opt/simmusic/nginx-temp/client;
 proxy_temp_path /opt/simmusic/nginx-temp/proxy;
 access_log off;
 server_tokens off;
 gzip on;
 gzip_types application/json;
 server {
  listen 80;
  server_name 121.40.158.251;
  location ^~ /.well-known/acme-challenge/ { root /opt/simmusic/acme-webroot; }
  location / { return 302 https://simmc-music.github.io; }
 }
 server {
  listen 1145 ssl;
  server_name 121.40.158.251;
  ssl_certificate /opt/simmusic/tls/fullchain.pem;
  ssl_certificate_key /opt/simmusic/tls/key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  client_max_body_size 200k;
  location /api/ {
   add_header Access-Control-Allow-Origin 'https://simmc-music.github.io' always;
   add_header Access-Control-Allow-Methods 'GET, POST, PATCH, PUT, DELETE, OPTIONS' always;
   add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
   add_header Access-Control-Max-Age 600 always;
   add_header Vary Origin always;
   if ($request_method = OPTIONS) { return 204; }
   proxy_pass http://127.0.0.1:3100;
   proxy_http_version 1.1;
   proxy_set_header Host $http_host;
   proxy_set_header X-Forwarded-Host $http_host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header CF-Connecting-IP $remote_addr;
   proxy_set_header Connection "";
   proxy_read_timeout 60s;
  }
  location / { return 302 https://simmc-music.github.io; }
 }
}
